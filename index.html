<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCards Fullscreen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">
    <div id="loader" class="absolute inset-0 flex items-center justify-center bg-gray-950 text-white z-10 transition-opacity duration-500 pointer-events-none">
        <div class="flex flex-col items-center gap-3">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium tracking-wide text-gray-400">Chargement de CineCards...</p>
        </div>
    </div>

    <!-- Container principal pour l'iframe CineCards prenant l'espace restant -->
    <div class="flex-1 w-full relative">
        <iframe 
            src="https://cinecards.base44.app" 
            title="CineCards" 
            class="w-full h-full border-none block"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen
            onload="document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').style.display = 'none', 500);">
        </iframe>
    </div>

    <!-- BEGIN AADS AD UNIT 2458415 -->
    <div id="frame" class="w-full bg-gray-950 py-1 shrink-0" style="position: relative; z-index: 99998;">
        <iframe data-aa='2458415' src='//acceptable.a-ads.com/2458415/?size=Adaptive'
                style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
    </div>
    <!-- END AADS AD UNIT 2458415 -->
</body>
</html>
